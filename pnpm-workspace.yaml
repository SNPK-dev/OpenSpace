packages:
  - "apps/*"
  - "packages/*"

overrides:
  "fast-xml-parser@4": "5.11.0"
  "js-yaml@<4.3.2": "4.3.2"
  "brace-expansion@1": "1.1.18"
  "brace-expansion@2": "2.1.4"
  "brace-expansion@5": "5.0.9"
  "form-data@3": "3.0.5"
  "form-data@4": "4.0.6"
  "joi@17": "17.13.4"
  "image-size": "workspace:2.0.3"
  "nanoid@3": "3.3.18"
  "postcss@8": "8.5.26"
  "shell-quote@1": "1.10.0"
  "tmp@0.2": "0.2.7"
  "uuid@7": "14.0.1"
  "ws@6": "6.2.6"
  "ws@7": "7.5.13"
  "ws@8": "8.21.3"
  "extract-zip": "workspace:2.0.2"

# Native toolchain packages required by the supported Web/Windows release and
# contract generation. Keep this allowlist explicit so lifecycle scripts remain
# fail-closed on a fresh host.
allowBuilds:
  "@bufbuild/buf": true
  electron: true
  electron-winstaller: true
  esbuild: true

minimumReleaseAgeExclude:
  - fast-xml-parser@5.11.0
