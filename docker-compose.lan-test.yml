name: openspace-lan-test

services:
  caddy:
    environment:
      LAN_DOMAIN: ${LAN_DOMAIN}
      LAN_FILES_DOMAIN: ${LAN_FILES_DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "openspace.lan:127.0.0.1"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://openspace.lan/healthz"]
