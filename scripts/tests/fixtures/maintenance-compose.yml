name: openspace-maintenance-drill
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: openspace, POSTGRES_PASSWORD: drill-password, POSTGRES_DB: openspace }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U openspace"], interval: 1s, timeout: 2s, retries: 30 }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment: { MINIO_ROOT_USER: drill-access, MINIO_ROOT_PASSWORD: drill-secret }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"], interval: 1s, timeout: 2s, retries: 30 }
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/true"]
  worker:
    build: { context: ../../../apps/worker, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: postgres://openspace:drill-password@postgres:5432/openspace
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: drill-access
      STORAGE_SECRET_KEY: drill-secret
      STORAGE_BUCKET: openspace
      MAINTENANCE_INTERVAL_SECONDS: "2"
      MAINTENANCE_BATCH_SIZE: "50"
      MAINTENANCE_RETRIES: "2"
    depends_on: { postgres: { condition: service_healthy }, minio: { condition: service_healthy } }
