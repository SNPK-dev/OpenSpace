name: openspace-dev

x-placeholder-service: &placeholder-service
  image: alpine:3.20
  restart: unless-stopped

x-healthcheck-postgres: &healthcheck-postgres
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 10s
  timeout: 5s
  retries: 10

x-healthcheck-redis: &healthcheck-redis
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 5s
  retries: 10

x-healthcheck-minio: &healthcheck-minio
  test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 10

x-healthcheck-livekit: &healthcheck-livekit
  test: ["CMD-SHELL", "wget -qO- http://localhost:7880 >/dev/null 2>&1 || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 10

x-healthcheck-coturn: &healthcheck-coturn
  test: ["CMD-SHELL", "grep -q ':0D96 ' /proc/net/udp"]
  interval: 30s
  timeout: 5s
  retries: 3

x-healthcheck-caddy: &healthcheck-caddy
  test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
  interval: 10s
  timeout: 5s
  retries: 10

services:
  api:
    build:
      context: ./apps/server-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openspace}:${POSTGRES_PASSWORD:-openspace}@postgres:5432/${POSTGRES_DB:-openspace}
      REDIS_URL: redis://redis:6379
      SERVER_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_TTL_DAYS: "30"
      STORAGE_ENDPOINT: minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-localhost:9000}
      STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-openspace}
      STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change-me-openspace}
      STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-openspace}
      STORAGE_USE_SSL: "false"
      STORAGE_PUBLIC_USE_SSL: ${OBJECT_STORAGE_PUBLIC_USE_SSL:-false}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      TURN_HOST: ${TURN_HOST:-localhost}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET:-devturn}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      livekit:
        condition: service_started
      coturn:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  realtime-gateway:
    build:
      context: ./apps/realtime-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openspace}:${POSTGRES_PASSWORD:-openspace}@postgres:5432/${POSTGRES_DB:-openspace}
      REDIS_URL: redis://redis:6379
      GATEWAY_PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,file://}
    ports:
      - "${GATEWAY_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openspace}:${POSTGRES_PASSWORD:-openspace}@postgres:5432/${POSTGRES_DB:-openspace}
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-openspace}
      STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change-me-openspace}
      STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-openspace}
      STORAGE_USE_SSL: "false"
      WORKER_PORT: "8090"
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-3600}
      MAINTENANCE_BATCH_SIZE: ${MAINTENANCE_BATCH_SIZE:-500}
      MAINTENANCE_RETRIES: ${MAINTENANCE_RETRIES:-3}
      MAINTENANCE_DRY_RUN: ${MAINTENANCE_DRY_RUN:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:8080/admin/"]
      interval: 10s
      timeout: 5s
      retries: 10

  web-client:
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openspace}
      POSTGRES_USER: ${POSTGRES_USER:-openspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openspace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck: *healthcheck-postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck: *healthcheck-redis

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-openspace}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change-me-openspace}
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost}
      MINIO_API_CORS_ALLOW_CREDENTIALS_WITH_WILDCARD: "off"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck: *healthcheck-minio

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-openspace}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-openspace}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change-me-openspace}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${OBJECT_STORAGE_ACCESS_KEY}" "$${OBJECT_STORAGE_SECRET_KEY}"
        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}"
        mc anonymous set none "local/$${OBJECT_STORAGE_BUCKET}"

  livekit:
    image: livekit/livekit-server:v1.9.11
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./.generated/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"
    healthcheck: *healthcheck-livekit

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./.generated/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - caddy-data:/data/caddy:ro
    ports:
      - "${TURN_PORT:-3478}:3478"
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_TLS_PORT:-5349}:5349"
      - "${TURN_TLS_PORT:-5349}:5349/udp"
      - "${TURN_RELAY_PORT_START:-50000}-${TURN_RELAY_PORT_END:-50100}:${TURN_RELAY_PORT_START:-50000}-${TURN_RELAY_PORT_END:-50100}/udp"
    healthcheck: *healthcheck-coturn

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    healthcheck: *healthcheck-caddy

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
