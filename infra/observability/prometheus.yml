global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: ["/etc/prometheus/rules/*.yml"]
scrape_configs:
  - job_name: openspace-api
    static_configs: [{ targets: ["api:8080"] }]
    metrics_path: /metrics
  - job_name: openspace-realtime
    static_configs: [{ targets: ["realtime-gateway:3001"] }]
    metrics_path: /metrics
  - job_name: openspace-worker
    static_configs: [{ targets: ["worker:8090"] }]
    metrics_path: /metrics
