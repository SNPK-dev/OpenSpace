syntax = "proto3";

package openspace.v1;

option go_package = "github.com/openspace/openspace/packages/contracts/gen/go/openspace/v1;openspacev1";

// DeviceCredential represents a per-device access credential on a server.
message DeviceCredential {
  string id = 1;
  string server_identity_id = 2;
  string device_public_key = 3;
  string device_status = 4;   // active | pending | revoked
  string client_type = 5;     // web | windows | mobile
  string created_at = 6;
  optional string last_seen_at = 7;
  optional string revoked_at = 8;
}

// ServerEntry represents a server in the client's Local Vault.
message ServerEntry {
  string server_id = 1;
  string name = 2;
  string url = 3;
  string connection_state = 4;  // discovered | not_joined | pending_approval | joined | unavailable | revoked | failed
  optional string device_id = 5;
  optional string server_identity_id = 6;
  string added_at = 7;
}

// ServerMetadata is returned by GET /.well-known/openspace/server.
message ServerMetadata {
  string server_id = 1;
  string name = 2;
  string public_url = 3;
  string registration_policy = 4;  // open | invite_code_only | approval_required | closed
  ServerFeatures features = 5;
  bool tls_required = 6;
}

message ServerFeatures {
  bool text = 1;
  bool voice = 2;
  bool files = 3;
  bool device_pairing = 4;
}

// PairingToken represents a one-time token for Device Pairing.
message PairingToken {
  string id = 1;
  string server_identity_id = 2;
  string created_by_device_id = 3;
  string scope = 4;
  string expires_at = 5;
  int32 usage_limit = 6;
  int32 used_count = 7;
  string status = 8;  // active | used | revoked | suspicious
}

// TransferBundle is the plaintext content of an encrypted Device Pairing bundle.
message TransferBundle {
  repeated TransferBundleServer servers = 1;
  string created_at = 2;
  string expires_at = 3;
}

message TransferBundleServer {
  string server_id = 1;
  string server_url = 2;
  string pairing_token = 3;
  string display_name = 4;
}
