name: openspace

# Standalone production topology. Do not combine this file with docker-compose.yml:
# the development file intentionally publishes dependency ports for local work.

x-healthcheck-postgres: &healthcheck-postgres
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 10s
  timeout: 5s
  retries: 10

x-healthcheck-redis: &healthcheck-redis
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 5s
  retries: 10

x-healthcheck-minio: &healthcheck-minio
  test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 10

x-healthcheck-livekit: &healthcheck-livekit
  test: ["CMD-SHELL", "wget -qO- http://localhost:7880 >/dev/null 2>&1 || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 10

x-healthcheck-coturn: &healthcheck-coturn
  test: ["CMD-SHELL", "grep -q ':0D96 ' /proc/net/udp"]
  interval: 30s
  timeout: 5s
  retries: 3

x-healthcheck-caddy: &healthcheck-caddy
  test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://localhost/healthz"]
  interval: 10s
  timeout: 5s
  retries: 10

services:
  api:
    image: ${OPENSPACE_API_IMAGE:-openspace-api:local}
    build:
      context: ./apps/server-api
      dockerfile: Dockerfile
    restart: always
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cpus: ${API_CPU_LIMIT:-1.0}
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    pids_limit: ${API_PIDS_LIMIT:-256}
    networks: [edge, data]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      REDIS_TRUST_BOUNDARY: compose-internal
      APP_ENV: production
      SERVER_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_TTL_DAYS: "30"
      STORAGE_ENDPOINT: minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT}
      STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      STORAGE_USE_SSL: "false"
      STORAGE_PUBLIC_USE_SSL: "true"
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      TURN_HOST: ${TURN_HOST}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      livekit:
        condition: service_started
      coturn:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  realtime-gateway:
    image: ${OPENSPACE_GATEWAY_IMAGE:-openspace-realtime-gateway:local}
    build:
      context: ./apps/realtime-gateway
      dockerfile: Dockerfile
    restart: always
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cpus: ${GATEWAY_CPU_LIMIT:-1.0}
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-256m}
    pids_limit: ${GATEWAY_PIDS_LIMIT:-256}
    networks: [edge, data]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      REDIS_TRUST_BOUNDARY: compose-internal
      APP_ENV: production
      GATEWAY_PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ${OPENSPACE_WORKER_IMAGE:-openspace-worker:local}
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    restart: always
    user: "10001:10001"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cpus: ${WORKER_CPU_LIMIT:-0.5}
    mem_limit: ${WORKER_MEMORY_LIMIT:-256m}
    pids_limit: ${WORKER_PIDS_LIMIT:-128}
    networks: [data]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      STORAGE_USE_SSL: "false"
      WORKER_PORT: "8090"
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-3600}
      MAINTENANCE_BATCH_SIZE: ${MAINTENANCE_BATCH_SIZE:-500}
      MAINTENANCE_RETRIES: ${MAINTENANCE_RETRIES:-3}
      MAINTENANCE_DRY_RUN: ${MAINTENANCE_DRY_RUN:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  admin-web:
    image: ${OPENSPACE_ADMIN_WEB_IMAGE:-openspace-admin-web:local}
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    restart: always
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cpus: ${ADMIN_WEB_CPU_LIMIT:-0.25}
    mem_limit: ${ADMIN_WEB_MEMORY_LIMIT:-128m}
    pids_limit: ${ADMIN_WEB_PIDS_LIMIT:-128}
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:8080/admin/"]
      interval: 10s
      timeout: 5s
      retries: 10

  web-client:
    image: ${OPENSPACE_WEB_IMAGE:-openspace-web-client:local}
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
    restart: always
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cpus: ${WEB_CLIENT_CPU_LIMIT:-0.25}
    mem_limit: ${WEB_CLIENT_MEMORY_LIMIT:-128m}
    pids_limit: ${WEB_CLIENT_PIDS_LIMIT:-128}
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    restart: always
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    networks: [data]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck: *healthcheck-postgres

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: always
    user: redis
    command: ["redis-server", "--appendonly", "yes"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    pids_limit: ${REDIS_PIDS_LIMIT:-128}
    networks: [data]
    volumes:
      - redis-data:/data
    healthcheck: *healthcheck-redis

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: always
    cpus: ${MINIO_CPU_LIMIT:-1.0}
    mem_limit: ${MINIO_MEMORY_LIMIT:-512m}
    pids_limit: ${MINIO_PIDS_LIMIT:-256}
    networks: [data]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_BASE_URL}
      MINIO_API_CORS_ALLOW_CREDENTIALS_WITH_WILDCARD: "off"
    volumes:
      - minio-data:/data
    healthcheck: *healthcheck-minio

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /root/.mc:rw,noexec,nosuid,size=4m
    cpus: ${MINIO_INIT_CPU_LIMIT:-0.25}
    mem_limit: ${MINIO_INIT_MEMORY_LIMIT:-128m}
    pids_limit: ${MINIO_INIT_PIDS_LIMIT:-64}
    networks: [data]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${OBJECT_STORAGE_ACCESS_KEY}" "$${OBJECT_STORAGE_SECRET_KEY}"
        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}"
        mc anonymous set none "local/$${OBJECT_STORAGE_BUCKET}"

  livekit:
    image: livekit/livekit-server:v1.9.11@sha256:289262ffae8b827f45186331aa315d08ed275eb30f9b0add337ec57948e44ca1
    restart: always
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cpus: ${LIVEKIT_CPU_LIMIT:-2.0}
    mem_limit: ${LIVEKIT_MEMORY_LIMIT:-1g}
    pids_limit: ${LIVEKIT_PIDS_LIMIT:-512}
    networks: [edge, data, media]
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./.generated/prod/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"
    healthcheck: *healthcheck-livekit

  coturn:
    image: coturn/coturn:4.6@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    restart: always
    security_opt: ["no-new-privileges:true"]
    cpus: ${COTURN_CPU_LIMIT:-1.0}
    mem_limit: ${COTURN_MEMORY_LIMIT:-512m}
    pids_limit: ${COTURN_PIDS_LIMIT:-512}
    networks: [media]
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./.generated/prod/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - caddy-data:/data/caddy:ro
    ports:
      - "${TURN_PORT:-3478}:3478"
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_TLS_PORT:-5349}:5349"
      - "${TURN_TLS_PORT:-5349}:5349/udp"
      - "${TURN_RELAY_PORT_START:-50000}-${TURN_RELAY_PORT_END:-50100}:${TURN_RELAY_PORT_START:-50000}-${TURN_RELAY_PORT_END:-50100}/udp"
    healthcheck: *healthcheck-coturn

  caddy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: always
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cpus: ${CADDY_CPU_LIMIT:-0.5}
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    pids_limit: ${CADDY_PIDS_LIMIT:-256}
    networks: [edge]
    volumes:
      - ./.generated/prod/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    healthcheck: *healthcheck-caddy

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: ["observability"]
    restart: always
    user: "65534:65534"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    networks: [data]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.5}
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    pids_limit: 128

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    profiles: ["observability"]
    restart: always
    user: "472:472"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    networks: [data]
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    cpus: ${GRAFANA_CPU_LIMIT:-0.5}
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-512m}
    pids_limit: 128

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:

networks:
  edge:
  data:
    internal: true
  media:
