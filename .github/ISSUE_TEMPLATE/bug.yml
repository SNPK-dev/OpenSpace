name: Bug report
description: Report a reproducible OpenSpace defect
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not report vulnerabilities or include credentials/private data. Follow SECURITY.md for security reports."
  - type: input
    id: version
    attributes: { label: OpenSpace version, placeholder: "1.0.0-rc.1 or commit SHA" }
    validations: { required: true }
  - type: textarea
    id: environment
    attributes: { label: Environment, description: "OS, browser/client, deployment topology, and relevant dependency versions" }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps, description: "Use synthetic data and remove secrets." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior and sanitized diagnostics }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, tokens, private messages, personal data, and vulnerability details.
          required: true
